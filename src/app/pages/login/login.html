<div class="min-h-screen bg-gray-950 text-white flex items-center justify-center px-6">
  <div class="w-full max-w-md">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-8">

      <h1 class="text-3xl font-bold text-center">
        Welcome Back
      </h1>

      <p class="text-gray-400 text-center mt-2 mb-8">
        Sign in to continue.
      </p>

      <label
        for="username"
        class="block text-sm font-medium mb-2"
      >
        Email Address
      </label>

      <input
        id="username"
        type="email"
        [(ngModel)]="email"
        placeholder="you@example.com"
        class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-3 mb-6 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
      >

      <label
        for="password"
        class="block text-sm font-medium mb-2"
      >
        Password
      </label>

      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        placeholder="••••••••"
        class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-3 mb-6 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
      >

      <button
        type="button"
        (click)="submit()"
        class="w-full bg-blue-600 hover:bg-blue-700 transition py-3 rounded-lg font-semibold text-white"
      >
        Sign In
      </button>

      <div><a href="/register">Don't have an account? Sign up</a></div>

    </div>
  </div>
</div>
