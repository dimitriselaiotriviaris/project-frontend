<form
  (ngSubmit)="submit()"
  #registerForm="ngForm"
>
  <div>
    <label>Role</label>

    <select
      name="roleId"
      [(ngModel)]="roleId"
      required
    >
      <option [ngValue]="2">Company</option>
      <option [ngValue]="3">Gamer</option>
    </select>
  </div>

  <div>
    <label>Username</label>

    <input
      type="text"
      name="username"
      [(ngModel)]="username"
      required
      minlength="2"
      maxlength="50"
    />
  </div>

  <div>
    <label>Email</label>

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      required
    />
  </div>

 <div>
  <label>Password</label>

  <input
    type="password"
    name="password"
    [(ngModel)]="password"
    #passwordField="ngModel"
    required
    minlength="8"
    pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*\W).{8,}"
  />

  @if (passwordField.invalid && passwordField.touched) {
    <div class="validation-error">
      Password must be at least 8 characters and contain:
      uppercase, lowercase, number, and special character.
    </div>
  }
</div>

  <button
    type="submit"
    [disabled]="registerForm.invalid"
  >
    Register
  </button>
</form>

@if (errorMessage) {
  <div class="registration-error">
    {{ errorMessage }}
  </div>
}

<p>
  Already registered?
  <a routerLink="/login">Login</a>
</p>
