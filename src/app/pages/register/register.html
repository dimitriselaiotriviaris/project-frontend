<form
  (ngSubmit)="submit()"
  #registerForm="ngForm"
>
  <div>
    <label>Role</label>

    <select
      name="roleId"
      [(ngModel)]="roleId"
      required
    >
      <option [ngValue]="3">Company</option>
      <option [ngValue]="2">Gamer</option>
    </select>
  </div>

  <div>
    <label>Username</label>

    <input
      type="text"
      name="username"
      [(ngModel)]="username"
      required
      minlength="2"
      maxlength="50"
    />
  </div>

  <div>
    <label>Email</label>

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      required
    />
  </div>

  <div>
    <label>Password</label>

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      required
    />
  </div>

  <button
    type="submit"
    [disabled]="registerForm.invalid"
  >
    Register
  </button>
</form>

<p>
  Already registered?
  <a routerLink="/login">Login</a>
</p>
